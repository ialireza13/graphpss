[project]
name = "graphpss"
version = "1.0.0"
description = "Protein secondary structure assignment from residue contact graphs (GraphPSS / PSS-net)"
requires-python = ">=3.10"
dependencies = [
  "gemmi",
  "torch>=2.1",
  "torch_geometric>=2.5",
  "numpy",
  "scipy",
  "pandas",
  "scikit-learn",
  "pyyaml",
  "matplotlib",
  "tqdm",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
